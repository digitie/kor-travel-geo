name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL system libraries
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Dpkg::Lock::Timeout=120 install -y --no-install-recommends gdal-bin libgdal-dev
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdal==$(gdal-config --version)"
          python -m pip install -e ".[api,loaders,dev]"
      - name: Lint and type-check
        run: |
          ruff check .
          mypy src/kortravelgeo scripts/export_openapi.py
          lint-imports
      - name: Test
        env:
          TMPDIR: /tmp
          TMP: /tmp
          TEMP: /tmp
        run: pytest -q

  # Opt-in PostGIS integration suites (T-325 review M6): the data_token fingerprint/cache/lock
  # tests, the activation lineage race, the dataset-version projection and the live hot-swap
  # round trip. They skip without KTG_TEST_PG_DSN, so this job provides one and then fails if
  # anything was skipped or too few tests were collected (a silent skip is not coverage).
  integration-postgis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kor_travel_geo_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      KTG_PG_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/kor_travel_geo_ci_test
      KTG_TEST_PG_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/kor_travel_geo_ci_test
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL, PostgreSQL 18 client tools, zstd
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Dpkg::Lock::Timeout=120 install -y --no-install-recommends \
            gdal-bin libgdal-dev postgresql-client-18 zstd
          pg_dump --version
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdal==$(gdal-config --version)"
          python -m pip install -e ".[api,loaders,dev]"
      - name: Bootstrap the scratch database (init-db + alembic stamp head)
        run: |
          ktgctl init-db
          alembic stamp head
      - name: Run the head migration both ways (0029 really executes)
        run: |
          alembic downgrade -1
          alembic upgrade head
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from kortravelgeo.infra.engine import make_async_engine
          async def main():
              engine = make_async_engine()
              async with engine.connect() as conn:
                  found = await conn.scalar(text(
                      "SELECT count(*) FROM information_schema.columns"
                      " WHERE table_schema = 'ops' AND table_name = 'dataset_snapshots'"
                      "   AND column_name = 'data_fingerprint'"))
              await engine.dispose()
              assert found == 1, found
          asyncio.run(main())
          PY
      - name: Integration suites
        run: |
          pytest -q -p no:cacheprovider -rs --junitxml=integration-junit.xml \
            tests/integration/test_t319_source_month_manifest_live.py::test_full_snapshot_replaces_absent_keys_and_rolls_back_failed_copy \
            tests/integration/test_full_load_batch_dagster_roundtrip.py::test_source_children_exclude_completed_rebuild_prepare_job \
            tests/integration/test_t325_data_fingerprint.py \
            tests/integration/test_serving_release_lineage_race.py \
            tests/integration/test_dataset_version_projection.py \
            tests/integration/test_backup_restore_hot_swap_roundtrip.py \
            tests/integration/test_maintenance_statement_timeout.py \
            tests/integration/test_polygon_address_links.py \
            tests/integration/test_serving_coordinate_quality.py \
            tests/integration/test_consistency_resume.py \
            tests/integration/test_region_radius_lock_timeout.py \
            tests/integration/test_region_radius_swap.py \
            tests/integration/test_dead_client_statement_cancel.py
      - name: Require real coverage (no skips, enough tests)
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          root = ET.parse("integration-junit.xml").getroot()
          cases = list(root.iter("testcase"))
          ran = Counter(
              c.get("classname").rsplit(".", 1)[-1]
              for c in cases
              if c.find("skipped") is None
          )
          skipped = sum(1 for c in cases if c.find("skipped") is not None)
          bad = sum(1 for c in cases if c.find("failure") is not None or c.find("error") is not None)
          print(dict(ran), f"skipped={skipped} failed={bad}")
          # Per-file floors: a whole module silently dropping out cannot hide behind the others.
          floors = {
              "test_full_load_batch_dagster_roundtrip": 1,
              "test_t319_source_month_manifest_live": 6,
              "test_t325_data_fingerprint": 30,
              "test_serving_release_lineage_race": 2,
              "test_dataset_version_projection": 3,
              "test_backup_restore_hot_swap_roundtrip": 3,
              "test_maintenance_statement_timeout": 4,
              "test_polygon_address_links": 1,
              "test_serving_coordinate_quality": 13,
              "test_consistency_resume": 14,
              "test_region_radius_lock_timeout": 3,
              "test_region_radius_swap": 11,
              "test_dead_client_statement_cancel": 2,
          }
          for module, floor in floors.items():
              assert ran[module] >= floor, f"{module}: {ran[module]} ran, expected >= {floor}"
          assert skipped == 0, f"{skipped} integration tests skipped"
          assert bad == 0
          PY

  # The Dagster image installs the main lib together with kor-travel-geo-dagster in one resolve
  # (SQLAlchemy 2.1 since T-322 lifted the Dagster package's <2.1 pin). This job tests that
  # resolve: the main lib, the Dagster package, and a real Postgres-backed Dagster instance
  # through the psycopg2 storage URL the image requires (dagster_postgres is psycopg2-only).
  dagster:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dagster
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL system libraries
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Dpkg::Lock::Timeout=120 install -y --no-install-recommends gdal-bin libgdal-dev
      # Same exact-version constraints as the image (dagster-shared plan stage 0), so these
      # tests run on the versions the image ships; test_image_constraints.py checks it.
      - name: Install main lib + Dagster package in one resolve (like dagster.Dockerfile)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c kor-travel-geo-dagster/docker/constraints-dagster.txt \
            "gdal==$(gdal-config --version)" \
            -e ".[api,loaders,dev]" -e "./kor-travel-geo-dagster[dev]"
          python -c "import sqlalchemy; v = sqlalchemy.__version__; print('sqlalchemy', v); assert v.startswith('2.1.'), v"
      - name: Test main lib on the Dagster image resolve
        env:
          KTG_EXECUTOR_TEST_PG_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/dagster
          TMPDIR: /tmp
          TMP: /tmp
          TEMP: /tmp
        run: pytest -q
      - name: Test Dagster package
        working-directory: kor-travel-geo-dagster
        env:
          TMPDIR: /tmp
        run: |
          python -c "import kortravelgeo_dagster.definitions"
          pytest -q
      - name: Dagster instance on Postgres via the image's storage URL (T-322)
        env:
          KTG_DAGSTER_PG_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/dagster
        run: |
          export DAGSTER_HOME=$(mktemp -d)
          cp kor-travel-geo-dagster/docker/dagster.yaml "$DAGSTER_HOME/"
          sh kor-travel-geo-dagster/docker/entrypoint.sh dagster instance migrate
          python - <<'PY'
          from dagster import DagsterEventType, DagsterInstance, job, op

          @op
          def ping() -> int:
              return 1

          @job
          def storage_smoke() -> None:
              ping()

          instance = DagsterInstance.get()
          result = storage_smoke.execute_in_process(instance=instance)
          assert result.success
          run = instance.get_run_by_id(result.run_id)
          assert run is not None and run.is_success, run
          events = instance.all_logs(result.run_id)
          assert any(e.dagster_event and e.dagster_event.event_type == DagsterEventType.RUN_SUCCESS for e in events)
          print("storage smoke ok:", result.run_id, len(events), "events")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kor-travel-geo-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: kor-travel-geo-ui/package-lock.json
      - name: Install frontend
        run: npx --yes npm@12.0.1 ci
      - name: Generate API types
        run: npm run gen:types
      - name: Verify generated files are committed
        run: git diff --exit-code -- types/api.gen.ts lib/schemas.gen.ts
      - name: Lint, type-check, test, build
        run: |
          npm run lint
          npm run type-check
          npm run test
          npm run build
