name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL system libraries
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Dpkg::Lock::Timeout=120 install -y --no-install-recommends gdal-bin libgdal-dev
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdal==$(gdal-config --version)"
          python -m pip install -e ".[api,loaders,dev]"
      - name: Lint and type-check
        run: |
          ruff check .
          mypy src/kortravelgeo scripts/export_openapi.py
          lint-imports
      - name: Test
        env:
          TMPDIR: /tmp
          TMP: /tmp
          TEMP: /tmp
        run: pytest -q

  # The Dagster image installs the main lib together with kor-travel-geo-dagster in one resolve
  # (SQLAlchemy 2.1 since T-322 lifted the Dagster package's <2.1 pin). This job tests that
  # resolve: the main lib, the Dagster package, and a real Postgres-backed Dagster instance
  # through the psycopg2 storage URL the image requires (dagster_postgres is psycopg2-only).
  dagster:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dagster
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL system libraries
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Dpkg::Lock::Timeout=120 install -y --no-install-recommends gdal-bin libgdal-dev
      - name: Install main lib + Dagster package in one resolve (like dagster.Dockerfile)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdal==$(gdal-config --version)" \
            -e ".[api,loaders,dev]" -e "./kor-travel-geo-dagster[dev]"
          python -c "import sqlalchemy; v = sqlalchemy.__version__; print('sqlalchemy', v); assert v.startswith('2.1.'), v"
      - name: Test main lib on the Dagster image resolve
        env:
          TMPDIR: /tmp
          TMP: /tmp
          TEMP: /tmp
        run: pytest -q
      - name: Test Dagster package
        working-directory: kor-travel-geo-dagster
        env:
          TMPDIR: /tmp
        run: |
          python -c "import kortravelgeo_dagster.definitions"
          pytest -q
      - name: Dagster instance on Postgres via the image's storage URL (T-322)
        env:
          KTG_DAGSTER_PG_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/dagster
        run: |
          export DAGSTER_HOME=$(mktemp -d)
          cp kor-travel-geo-dagster/docker/dagster.yaml "$DAGSTER_HOME/"
          sh kor-travel-geo-dagster/docker/entrypoint.sh dagster instance migrate
          python - <<'PY'
          from dagster import DagsterEventType, DagsterInstance, job, op

          @op
          def ping() -> int:
              return 1

          @job
          def storage_smoke() -> None:
              ping()

          instance = DagsterInstance.get()
          result = storage_smoke.execute_in_process(instance=instance)
          assert result.success
          run = instance.get_run_by_id(result.run_id)
          assert run is not None and run.is_success, run
          events = instance.all_logs(result.run_id)
          assert any(e.dagster_event and e.dagster_event.event_type == DagsterEventType.RUN_SUCCESS for e in events)
          print("storage smoke ok:", result.run_id, len(events), "events")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kor-travel-geo-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kor-travel-geo-ui/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Generate API types
        run: npm run gen:types
      - name: Verify generated files are committed
        run: git diff --exit-code -- types/api.gen.ts lib/schemas.gen.ts
      - name: Lint, type-check, test, build
        run: |
          npm run lint
          npm run type-check
          npm run test
          npm run build
