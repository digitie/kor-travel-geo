[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# alembic/env.py가 Settings.pg_dsn(KTG_PG_DSN)으로 덮어쓴다. 여기 값은 참고용 placeholder다.
sqlalchemy.url = postgresql+psycopg://kor_travel_geo_app:change-me@127.0.0.1:11000/kor_travel_geo

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

